# Ollama's output, which daemon(8) reopens on the SIGHUP to its supervisor.
# llmgate's own logs rotate themselves (llmgate.toml [log]).
# logfilename           [owner:group]  mode count size  when  flags [/pid_file]
/var/log/llm/llm.log    llm:llm        640  7     10240 *     JC    /var/run/llm/llm.pid
